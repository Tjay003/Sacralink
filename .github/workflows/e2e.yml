name: e2e

# The full real suite (web/e2e-local) against a local Supabase stack in Docker on the runner, split
# across four runners that each get their own database. A backend release waits for this (see
# docs/agents/test-workflow.md). Nothing here deploys anything, uses secrets or talks to the production
# Supabase project.
#
# A push runs it only when it touches the paths below, so a docs or UI push neither starts it nor
# cancels a run in flight. The nightly run covers UI changes that break a spec. For a backend release
# whose change sits outside these paths (roles or permissions in page code), start it by hand:
# gh workflow run e2e.yml --ref main
on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/local-db-setup.ps1'
      - 'web/src/lib/**'
      - 'web/e2e-local/**'
      - 'web/playwright.local.config.ts'
      - 'web/.env.e2e'
      - 'web/package.json'
      - 'web/package-lock.json'
      - '.github/workflows/e2e.yml'
  schedule:
    # 02:00 in Manila.
    - cron: '0 18 * * *'
  workflow_dispatch:

concurrency:
  # Separate groups per trigger, so the nightly run and a push run never cancel each other.
  group: e2e-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned to the Supabase CLI version the local stack is developed with (see supabase/.temp/cli-latest).
  SUPABASE_CLI_VERSION: 2.121.0
  # Legacy migrations written for the SQL editor that fail on a fresh database. Harmless and
  # documented in docs/agents/test-workflow.md; any failure outside this list fails the job.
  LEGACY_MIGRATION_FAILURES: >-
    003_enable_rls_profiles.sql,
    004_enable_rls_all_tables.sql,
    009_create_sacrament_requirements.sql,
    018_create_avatars_storage.sql,
    024_fix_profiles_rls_recursion.sql,
    034_secure_donations_super_admin_blindspot.sql,
    038_fix_church_update_rls_and_storage.sql,
    052_create_update_church_livestream_rpc.sql,
    053_add_churches_to_realtime_publication.sql

jobs:
  e2e:
    name: e2e-local (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Every shard finishes, so one run reports all failing specs at once.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Start local Supabase
        # Studio and postgres-meta are not used by the tests; the mail inbox is (password recovery spec).
        run: supabase start -x studio,postgres-meta

      - name: Apply the database schema
        run: pwsh -File scripts/local-db-setup.ps1 -Reset -AllowFailures "$LEGACY_MIGRATION_FAILURES"

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run e2e-local
        working-directory: web
        run: npm run test:e2e:local -- --shard=${{ matrix.shard }}/4

      - name: Show Supabase container logs
        if: failure()
        run: |
          docker ps -a
          for c in $(docker ps -a --format '{{.Names}}' | grep -E 'supabase_(db|auth|rest|kong|storage|realtime)_'); do
            echo "::group::$c"
            docker logs --tail 80 "$c" 2>&1 || true
            echo "::endgroup::"
          done

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts-shard-${{ matrix.shard }}
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 7
