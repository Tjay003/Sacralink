name: CI

# Typecheck and production build on every push to main, in about a minute. This is the only check a
# UI-only or docs-only release waits for. The full real suite lives in e2e.yml. Nothing here deploys
# anything, uses secrets or talks to the production Supabase project.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npx tsc -b

      - name: Build
        working-directory: web
        env:
          # Dummy values only: the build needs a URL and key to exist, it never contacts anything.
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: dummy-anon-key-for-ci-build
        run: npx vite build
